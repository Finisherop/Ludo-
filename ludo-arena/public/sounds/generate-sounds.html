<!DOCTYPE html>
<html>
<head>
    <title>Generate Ludo Arena Sounds</title>
</head>
<body>
    <h1>Generating Ludo Arena Sound Files...</h1>
    <div id="status"></div>
    
    <script>
        function generateAudioDataURL(type, duration = 0.5) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const sampleRate = audioContext.sampleRate;
            const length = sampleRate * duration;
            const buffer = audioContext.createBuffer(1, length, sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < length; i++) {
                const t = i / sampleRate;
                let value = 0;

                switch (type) {
                    case 'dice':
                        value = Math.random() * 0.3 * Math.exp(-t * 10);
                        break;
                    case 'move':
                        value = Math.sin(2 * Math.PI * 800 * t) * 0.2 * Math.exp(-t * 8);
                        break;
                    case 'win':
                        value = Math.sin(2 * Math.PI * (440 + t * 200) * t) * 0.3 * Math.exp(-t * 2);
                        break;
                    case 'background':
                        value = Math.sin(2 * Math.PI * 220 * t) * 0.1 + 
                                Math.sin(2 * Math.PI * 330 * t) * 0.05 +
                                Math.sin(2 * Math.PI * 440 * t) * 0.03;
                        break;
                }

                data[i] = value;
            }

            // Convert to WAV format
            const wavBuffer = new ArrayBuffer(44 + length * 2);
            const view = new DataView(wavBuffer);
            
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, length * 2, true);
            
            let offset = 44;
            for (let i = 0; i < length; i++) {
                const sample = Math.max(-1, Math.min(1, data[i]));
                view.setInt16(offset, sample * 0x7FFF, true);
                offset += 2;
            }
            
            return new Blob([wavBuffer], { type: 'audio/wav' });
        }

        async function generateSounds() {
            const status = document.getElementById('status');
            const sounds = [
                { name: 'dice-roll', type: 'dice', duration: 0.5 },
                { name: 'pawn-move', type: 'move', duration: 0.3 },
                { name: 'win', type: 'win', duration: 1.0 },
                { name: 'background', type: 'background', duration: 10.0 }
            ];

            for (const sound of sounds) {
                status.innerHTML += `Generating ${sound.name}...<br>`;
                const blob = generateAudioDataURL(sound.type, sound.duration);
                
                // Create download link
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${sound.name}.mp3`;
                a.textContent = `Download ${sound.name}.mp3`;
                a.style.display = 'block';
                a.style.margin = '5px 0';
                document.body.appendChild(a);
            }
            
            status.innerHTML += '<br>All sounds generated! Download the files and place them in the /public/sounds/ directory.';
        }

        generateSounds();
    </script>
</body>
</html>
